{% extends "base.html" %}
{% block title %}Login | Gestion Empresarial{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 mb-3">Iniciar sesion</h1>
                <form method="post">
                    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label" for="email">Correo</label>
                        <input class="form-control" id="email" name="email" type="email" autocomplete="email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="password">Contrasena</label>
                        <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <a class="small" href="{{ url_for('auth.forgot_password') }}">Olvide mi contrasena</a>
                    </div>
                    <button class="btn btn-primary w-100" type="submit">Ingresar</button>
                </form>
                <p class="text-center small mt-3 mb-0">
                    No tienes cuenta? <a href="{{ url_for('auth.register') }}">Registrate</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
