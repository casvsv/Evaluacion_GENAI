{% extends "base.html" %}
{% block title %}Registro | Gestion Empresarial{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 mb-3">Crear cuenta</h1>
                <form method="post">
                    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label" for="email">Correo</label>
                        <input class="form-control" id="email" name="email" type="email" autocomplete="email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="password">Contrasena</label>
                        <input class="form-control" id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="confirm_password">Confirmar contrasena</label>
                        <input class="form-control" id="confirm_password" name="confirm_password" type="password" minlength="8" autocomplete="new-password" required>
                    </div>
                    <button class="btn btn-primary w-100" type="submit">Registrarme</button>
                </form>
                <p class="text-center small mt-3 mb-0">
                    Ya tienes cuenta? <a href="{{ url_for('auth.login') }}">Inicia sesion</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
