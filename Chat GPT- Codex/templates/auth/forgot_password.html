{% extends "base.html" %}
{% block title %}Recuperar contrasena | Gestion Empresarial{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 mb-3">Recuperar contrasena</h1>
                <form method="post">
                    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label" for="email">Correo registrado</label>
                        <input class="form-control" id="email" name="email" type="email" autocomplete="email" required>
                    </div>
                    <button class="btn btn-primary" type="submit">Generar enlace</button>
                    <a class="btn btn-link" href="{{ url_for('auth.login') }}">Volver</a>
                </form>
                {% if simulated_link %}
                <div class="alert alert-secondary mt-4 mb-0">
                    <div class="fw-semibold">Envio simulado:</div>
                    <a href="{{ simulated_link }}">{{ simulated_link }}</a>
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
