{% set rows = [employee] if employee else employees %}
<div class="card shadow-sm">
    <div class="table-responsive">
        <table class="table align-middle mb-0">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Cargo</th>
                    <th>Salario</th>
                    <th class="text-end">Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for item in rows %}
                <tr>
                    <td>{{ item.id }}</td>
                    <td class="fw-semibold">{{ item.name }}</td>
                    <td>{{ item.position }}</td>
                    <td>${{ "%.2f"|format(item.salary) }}</td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('employees.show_employee', employee_id=item.id) }}">Ver</a>
                        <a class="btn btn-sm btn-outline-primary" href="{{ url_for('employees.edit_employee', employee_id=item.id) }}">Editar</a>
                        <form class="d-inline" method="post" action="{{ url_for('employees.delete_employee', employee_id=item.id) }}" onsubmit="return confirm('Eliminar este empleado?');">
                            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                            <button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
                        </form>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="5" class="text-center text-muted py-4">No hay empleados registrados.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
