{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm mt-5">
            <div class="card-body p-4">
                <h3 class="text-center mb-4">Nueva Contraseña</h3>
                <form method="POST" action="">
                    <div class="mb-3">
                        <label for="password" class="form-label">Ingresa tu nueva contraseña</label>
                        <input type="password" class="form-control" id="password" name="password" required minlength="6" autofocus>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Actualizar Contraseña</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
