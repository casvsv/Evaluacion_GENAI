{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0">{{ 'Editar Empleado' if empleado else 'Registrar Nuevo Empleado' }}</h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre Completo</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" required 
                               value="{{ empleado.nombre if empleado else '' }}">
                    </div>
                    <div class="mb-3">
                        <label for="cargo" class="form-label">Cargo o Posición</label>
                        <input type="text" class="form-control" id="cargo" name="cargo" required
                               value="{{ empleado.cargo if empleado else '' }}">
                    </div>
                    <div class="mb-4">
                        <label for="salario" class="form-label">Salario Anual</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="number" step="0.01" class="form-control" id="salario" name="salario" required
                                   value="{{ empleado.salario if empleado else '' }}">
                        </div>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('main.index') }}" class="btn btn-light border">Cancelar</a>
                        <button type="submit" class="btn btn-primary">
                            {{ 'Actualizar Datos' if empleado else 'Guardar Empleado' }}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
